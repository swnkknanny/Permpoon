<style>
:root{
  --navy:#0b2160; --navy2:#1c3a7a; --blue:#1677f2; --sky:#0ea0e6;
  --bg:#f3f6fb; --card:#fff; --line:#e3e9f3; --line2:#eef2f8; --text:#14213d; --soft:#5d6b86; --faint:#8a96ad;
  --R:#2563eb; --Rbg:#eaf1ff; --Rbd:#c7d8fb; --M:#e07a1f; --Mtx:#b85f10; --Mbg:#fff2e5; --Mbd:#f6d3b0;
  --A:#2e8b57; --Atx:#23704a; --Abg:#e8f6ee; --Abd:#bfe3cd; --bad:#c2413b; --badbg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,#fff 0,#fff 267px,var(--line) 267px,var(--line) 268px,transparent 268px)}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.logo img{height:34px;width:auto}
.logo b{font-size:21px;letter-spacing:-.2px;color:var(--navy)}
.logo b span{color:var(--blue)}
.sec{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.3px;margin:12px 6px 4px}
.stn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;background:#fafcff;text-align:left;width:100%}
.stn:hover{border-color:#c8d4ea}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stn .t{font-weight:600;font-size:15px;display:block}.stn .s{font-size:12.5px;color:var(--soft);display:block}.stn.on .s{color:#c6d3ef}
.stn svg.ic{margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--soft);font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:#f3f6fc;color:var(--text)}
.nav.on{background:#e8eefb;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;font-size:14.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#c3cee3;background:#f8faff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.danger{color:var(--bad);border-color:#f0c9c6}
.btn.save{background:var(--A);color:#fff;border-color:var(--A)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.side .btn{width:100%;justify-content:flex-start}
.pill{margin-top:8px;border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;background:#f1f4f9;color:var(--soft)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:7px;flex:none}
.pill.ok{background:var(--Abg);color:var(--Atx)}.pill.ok i{background:var(--A)}
.foot{margin-top:auto;padding-top:10px}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);font-size:14px}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e8eefb;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--M)}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;display:flex;align-items:center;gap:10px;color:var(--navy);line-height:1.3}
h1 svg.ic{width:26px;height:26px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:500;color:var(--soft);background:none;border:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--navy);color:#fff}
.sel{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 12px;font-weight:500}
.sel label{color:var(--soft);font-weight:400;font-size:14px}
.sel select{border:0;background:transparent;padding:5px 6px;font-weight:500;max-width:100%;outline:none}
select.fld,input.fld{border:1px solid #cfd8e8;border-radius:10px;padding:9px 12px;background:#fff;width:100%;outline:none}
select.fld:focus,input.fld:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;min-width:0}
.card h3{font-size:16.5px;display:flex;align-items:center;gap:8px;line-height:1.35}
.sub{color:var(--soft);font-size:13.5px;margin-top:2px}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);color:var(--faint);font-size:11.5px;font-weight:700;font-family:Georgia,serif;font-style:italic;background:#fff;flex:none;padding:0}
.info:hover{border-color:var(--blue);color:var(--blue)}
.kpi .ico{width:40px;height:40px;border-radius:11px;background:#eaf0fb;display:grid;place-items:center;color:var(--navy);margin-bottom:12px}
.kpi .lb{font-size:14px;color:var(--soft);font-weight:500}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;margin-top:2px}.kpi .v small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.kpi .n{font-size:13px;color:var(--faint)}
.kpi .info{position:absolute;right:16px;top:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.badge svg.ic{width:14px;height:14px}
.ok{background:var(--Abg);color:var(--Atx)}.bad{background:var(--badbg);color:var(--bad)}.mute{background:#eef2f8;color:var(--soft)}
.rk{display:flex;align-items:center;gap:10px;margin-top:12px}
.rk .nm{width:130px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .tr{flex:1;height:10px;background:#eef2f8;border-radius:6px;overflow:hidden}.rk .tr i{display:block;height:100%;border-radius:6px}
.rk .ct{width:70px;text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;color:var(--soft);font-weight:600;font-size:13px;padding:9px 10px;border-bottom:1px solid var(--line);background:#f8fafd;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:#f5f8fe;font-weight:600;cursor:pointer}
tr.grp:hover td{background:#edf2fc}
tr.ev{cursor:pointer}tr.ev:hover td,tr.click:hover td{background:#fafcff}
tr.click{cursor:pointer}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700}
.tR{background:var(--Rbg);color:var(--R)}.tM{background:var(--Mbg);color:var(--Mtx)}.tA{background:var(--Abg);color:var(--Atx)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--faint);min-width:220px;background:#fff}
.search input{border:0;outline:none;padding:8px 0;flex:1;min-width:0;color:var(--text)}
.lbl{font-size:13.5px;color:var(--soft);font-weight:500;margin-bottom:6px}
.inp{position:relative}
.inp input{width:100%;border:1px solid #cfd8e8;border-radius:10px;padding:9px 28px 9px 10px;font-size:19px;-moz-appearance:textfield;font-weight:600;background:#fff;outline:none}
.inp input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--soft);font-weight:500}
.inp.auto input{background:#e9f7ee;border-color:#9fd5b3}
.res{border-radius:16px;padding:18px 20px;border:1px solid;min-width:0}
.res.R{background:var(--Rbg);border-color:var(--Rbd)}.res.M{background:var(--Mbg);border-color:var(--Mbd)}.res.A{background:var(--Abg);border-color:var(--Abd)}
.res .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.big{background:#fff;border-radius:12px;padding:12px 14px;margin:12px 0 8px}
.big .k{font-size:13px;color:var(--soft)}.big .v{font-size:34px;font-weight:700;line-height:1.15;word-break:break-word}.big .v small{font-size:17px;margin-left:4px;color:var(--soft);font-weight:600}
.big .v.empty{font-size:28px;color:var(--faint)}
.res .ln{font-size:13.5px;color:var(--soft)}
.res .ln b{color:var(--text)}
details.fx summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer}
details.fx summary::-webkit-details-marker{display:none}
details.fx[open] summary .chev{transform:rotate(180deg)}
.care{border-radius:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.care:hover{border-color:#c3cee3}
.care .no{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.slider{width:100%;accent-color:var(--R)}
.slider.m{accent-color:var(--M)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.cmp .a{color:var(--soft);text-align:right}.cmp .b{font-weight:700;text-align:right}
.qk{background:#f5f8fe;border-radius:12px;padding:10px 12px;min-width:0}
.qk .l{font-size:13px;color:var(--soft)}.qk .v{font-size:22px;font-weight:700;line-height:1.3}.qk .n{font-size:12px;color:var(--faint)}
.empty-state{text-align:center;padding:60px 20px;color:var(--soft)}
.empty-state .ico{width:64px;height:64px;border-radius:18px;background:#e8eefb;color:var(--navy);display:grid;place-items:center;margin:0 auto 14px}
.empty-state .ico svg.ic{width:30px;height:30px}
.empty-state h2{color:var(--text);font-size:20px;margin-bottom:6px}
.note{font-size:13px;color:var(--faint)}
.warnbox{background:#fff8e6;border:1px solid #f1dca0;color:#7a5b00;border-radius:12px;padding:10px 14px;font-size:14px}
.errbox{background:var(--badbg);border:1px solid #f0c9c6;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px}
.chart-box{position:relative;height:260px}
pre.code{background:#0f1a33;color:#dbe4f7;border-radius:12px;padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.55;max-height:60vh}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,26,51,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto}
.ovl.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,26,51,.25);display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:900px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:18px}
.modal .mb{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.xbtn{border:0;background:#f1f4f9;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--soft)}
.chk-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.chk-row input{width:17px;height:17px;accent-color:var(--navy)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--soft)}
.stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 20px}
.stabs button{border:0;background:none;padding:10px 10px;color:var(--soft);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button.on{color:var(--navy);border-color:var(--blue);font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;font-size:14.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none}
.toast.show{display:block}
.spinner{width:18px;height:18px;border:2.5px solid #c9d5ee;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none}
input[type=file].hidden-file{display:none}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-plan{grid-template-columns:1fr!important}.layout-2{grid-template-columns:1fr!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:none}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,26,51,.35);z-index:50}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .crumb{display:none}
  .content{padding:18px 16px 40px}
  .g3,.g2{grid-template-columns:1fr}
  h1{font-size:22px}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}.kpi .v{font-size:24px}.kpi .ico{width:34px;height:34px;margin-bottom:8px}
  .seg button{padding:7px 10px;font-size:14px}
  .search{min-width:0;flex:1 1 100%}
  .rk .nm{width:92px}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .big .v{font-size:28px}
  .top .acts .btn span.t{display:none}
}

/* print = Export PDF */
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;font-size:12px}
  .side,.top,.no-print,.ovl,.toast,.info{display:none!important}
  .app{display:block}
  .content{padding:0;gap:10px}
  .card,.res{break-inside:avoid;border-color:#ccd}
  .page{display:none!important}
  .page.print-on{display:flex!important;flex-direction:column;gap:12px}
  .print-head{display:flex!important}
}
.print-head{display:none;align-items:center;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:6px}
.print-head img{height:30px}
.page{display:flex;flex-direction:column;gap:18px}

.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.qtag{background:var(--badbg);color:var(--bad);font-size:11px;padding:0 6px;margin-left:4px;white-space:nowrap}

.info.why{border-color:var(--M);color:var(--M);width:18px;height:18px;font-size:10.5px;margin-left:6px;vertical-align:middle;position:relative;top:-2px}
.info.why:hover{background:var(--Mbg)}
.dash{white-space:nowrap}
.kpi .v .info.why{position:relative;top:-6px;right:auto}

.card.drill{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card.drill:hover{border-color:#b9c7e2;box-shadow:0 4px 16px rgba(11,33,96,.07)}
.drill-hint{font-size:12px;color:var(--faint);margin-top:6px}
.modal .mb > *{flex-shrink:0}

/* รายงานสรุป 1 หน้า */
.rep{font-size:11px;color:#14213d;display:flex;flex-direction:column;gap:10px}
.rep-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:8px}
.rep-head img{height:34px}
.rep-t{font-size:15px;font-weight:700;color:var(--navy)}
.rep-s{font-size:10px;color:var(--soft)}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.rep-h{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.rep-tb{width:100%;border-collapse:collapse;font-size:10.5px}
.rep-tb th{font-size:10px;padding:3px 5px;background:#eef2f8;border-bottom:1px solid #ccd5e6}
.rep-tb td{padding:3px 5px;border-bottom:1px solid #e3e9f3}
.rep-n{font-size:9.5px;color:var(--soft);margin-top:3px;line-height:1.5}
.rep-foot{font-size:9px;color:var(--soft);border-top:1px solid #ccd5e6;padding-top:6px;line-height:1.5}
@media print{ body.print-report .print-head{display:none!important} }

</style>

<script id="seedData" type="application/json">{"rows": [], "source": ""}</script>
<!-- โค้ด Python สำหรับหน้า "ตรวจสอบด้วย Python" (รันผ่าน Pyodide) -->
<script id="pyCode" type="text/x-python">
# RAMSight — ตรวจสอบด้วย Python (ใช้ไลบรารีมาตรฐานเท่านั้น)
# RAW_JSON = แถวต้นฉบับทุกแถวจาก Excel (ทุกชีตที่เลือกตอนอัปโหลด) · RAM_HRS = เกณฑ์ชั่วโมงของมิติ M
import json, re, math
from datetime import datetime, timedelta
from statistics import mean
from collections import Counter, defaultdict

rows = json.loads(RAW_JSON)
EPOCH = datetime(1970, 1, 1)
COMP_NONE = {'', '-', '–', 'ไม่ระบุ', 'ชั่วคราว', 'ชั่วคราว/ไม่ระบุ'}

def to_time(v):
    """แปลงเวลาเป็น datetime ปัดเป็นนาที: เลขซีเรียลของ Excel (นับจาก 1899-12-30) หรือข้อความวันที่"""
    if v is None or v == '':
        return None
    if isinstance(v, (int, float)):
        minutes = math.floor((v - 25569) * 1440 + 0.5)
        return EPOCH + timedelta(minutes=minutes)
    s = str(v).strip()
    m = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$', s)
    if m:
        d = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
    else:
        m = re.match(r'^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$', s)
        if m:
            y = int(m[3])
            if len(m[3]) == 2:            # ปี 2 หลัก: <= 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
                y = 2000 + y if y <= 50 else 2500 + y
            if y > 2400:
                y -= 543
            d = datetime(y, int(m[2]), int(m[1]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
        elif re.match(r'^\d+(\.\d+)?$', s):
            return to_time(float(s))
        else:
            return None
    return EPOCH + timedelta(minutes=math.floor((d - EPOCH).total_seconds() / 60 + 0.5))

TIME_RE = re.compile(r'^(\d{1,2})[:.](\d{2})(?::(\d{2}))?\s*(?:น\.?)?$')

def is_time_only(v):
    if isinstance(v, (int, float)):
        return 0 <= v < 1
    m = TIME_RE.match(str(v if v is not None else '').strip())
    return bool(m) and int(m[1]) < 24

def tod_minutes(v):
    if isinstance(v, (int, float)):
        return math.floor(v * 1440 + 0.5)
    m = TIME_RE.match(str(v).strip())
    return int(m[1]) * 60 + int(m[2])

def row_times(r):
    """ไฟล์จริงบางชุด from/to มีแค่เวลา (เช่น 08:35) ส่วนวันที่อยู่คอลัมน์ date → รวมกัน"""
    fo, to_ = is_time_only(r.get('from')), is_time_only(r.get('to'))
    if not fo and not to_:
        return to_time(r.get('from')), to_time(r.get('to'))
    d = to_time(r.get('date'))
    if d is None:
        return None, None
    day = datetime(d.year, d.month, d.day)
    f = day + timedelta(minutes=tod_minutes(r['from'])) if fo else to_time(r.get('from'))
    t = day + timedelta(minutes=tod_minutes(r['to'])) if to_ else to_time(r.get('to'))
    if to_ and f is not None and t < f:      # ไฟกลับหลังเที่ยงคืน = วันถัดไป
        t += timedelta(days=1)
    return f, t

def hours(a, b):
    return (b - a).total_seconds() / 3600

def prefix(code):
    m = re.match(r'^([A-Za-z]+)', str(code or '').strip())
    return m[1].upper() if m else ''

def ram_class(cause, comp, dur):
    if cause == 'ไม่ทราบสาเหตุ' or str(comp or '').strip() in COMP_NONE:
        return 'A'
    return 'M' if dur > RAM_HRS else 'R'

# ---------- ① ตัดแถวซ้ำ + ตรวจคุณภาพ ----------
sheet_rows = Counter(r['sheet'] for r in rows)
seen, uniq = {}, []
for r in rows:
    f, t = row_times(r)
    key = (r.get('group'), r.get('line'), r.get('feeder'), f or ('x', str(r.get('from'))), t or ('x', str(r.get('to'))))
    if key not in seen:
        seen[key] = len(uniq)
        uniq.append({'r': r, 'f': f, 't': t})
missing = reversed_ = zero = too_long = 0
good = []
for u in uniq:
    if u['f'] is None or u['t'] is None:
        missing += 1
    elif u['t'] == u['f']:      # from = to: ไม่ตัดทิ้ง นับเป็นดับ 0 นาทีตามที่กรอก
        zero += 1
        good.append(u)
    elif u['t'] < u['f']:
        reversed_ += 1
    elif hours(u['f'], u['t']) > 8760:
        too_long += 1
    else:
        good.append(u)
F_rows = [u for u in good if u['r'].get('group') == 'F']
L_rows = [u for u in good if u['r'].get('group') == 'L']

# ---------- เหตุสายป้อน: 1 แถว = 1 เหตุ ----------
events = []
for u in F_rows:
    r = u['r']; dur = hours(u['f'], u['t'])
    events.append({'grp': 'F', 'unit': r.get('feeder'), 'stn': prefix(r.get('feeder')), 'from': u['f'], 'to': u['t'], 'dur': dur,
                   'comp': r.get('t_componen'), 'ram': ram_class(r.get('t_cause'), r.get('t_componen'), dur)})

# ---------- เหตุสายส่ง: รวมแถวที่ line + from เดียวกัน ----------
votes = defaultdict(Counter)
for u in L_rows:
    p = prefix(u['r'].get('feeder'))
    if p:
        votes[u['r'].get('line')][p] += 1
line_stn = {l: c.most_common(1)[0][0] for l, c in votes.items()}
groups = defaultdict(list)
for u in L_rows:
    groups[(u['r'].get('line'), u['f'])].append(u)
for (line, f), us in groups.items():
    dur = mean(hours(x['f'], x['t']) for x in us)
    r = us[0]['r']
    events.append({'grp': 'L', 'unit': line, 'stn': line_stn.get(line, prefix(line)), 'from': f, 'to': f + timedelta(hours=dur), 'dur': dur,
                   'comp': r.get('t_componen'), 'ram': ram_class(r.get('t_cause'), r.get('t_componen'), dur)})

# ---------- ② สูตร: หน่วย = สถานี + รหัสสาย ----------
def analyse(evs):
    by_unit = defaultdict(list)
    for e in evs:
        by_unit[(e['stn'], e['unit'])].append(e)
    units, ev_mtbf, ev_A, all_gaps = [], [], [], []
    for (stn, unit), es in by_unit.items():
        es.sort(key=lambda e: e['from'])
        gaps = []
        for i in range(1, len(es)):
            g = hours(es[i - 1]['to'], es[i]['from'])
            if g > 0:
                gaps.append(g)
        all_gaps += gaps
        mttr = mean(e['dur'] for e in es)
        mtbf = mean(gaps) if gaps else None
        if mtbf is not None:
            for e in es:
                ev_mtbf.append(mtbf)
                ev_A.append(mtbf / (mtbf + e['dur']) * 100)
        units.append({'unit': unit, 'stn': stn, 'n': len(es), 'ngaps': len(gaps), 'mtbf': mtbf, 'mttr': mttr,
                      'A': (mtbf / (mtbf + mttr) * 100) if mtbf is not None else None})
    units.sort(key=lambda u: (-u['n'], u['A'] if u['A'] is not None else 999, u['unit']))
    comps = Counter('ไม่ระบุ' if str(e['comp'] or '').strip() in COMP_NONE else e['comp'] for e in evs)
    top = [(c, n) for c, n in comps.most_common() if c != 'ไม่ระบุ']
    return {
        'n': len(evs),
        'mtbf_days': mean(ev_mtbf) / 24 if ev_mtbf else None,
        'pooled_days': mean(all_gaps) / 24 if all_gaps else None,
        'mttr': mean(e['dur'] for e in evs) if evs else None,
        'A': mean(ev_A) if ev_A else None,
        'ram': {k: sum(1 for e in evs if e['ram'] == k) for k in 'RAM'},
        'top_comp': f'{top[0][0]} {top[0][1]}' if top else '– 0',
        'top5': units[:5],
        'units': units,
        'low10': sorted([u for u in units if u['A'] is not None], key=lambda u: u['A'])[:10],
    }

F = analyse([e for e in events if e['grp'] == 'F'])
L = analyse([e for e in events if e['grp'] == 'L'])
json.dumps({
    'quality': {'raw': len(rows), 'sheets': len(sheet_rows), 'unique': len(uniq), 'dupes': len(rows) - len(uniq),
                'rowsF': len(F_rows), 'rowsL': len(L_rows), 'missing': missing, 'reversed': reversed_, 'zero': zero, 'long': too_long,
                'used': len(events)},
    'F': F, 'L': L,
}, ensure_ascii=False)

<script>
'use strict';
/* =====================================================================
   RAMSight — วิเคราะห์ R/A/M ของสายป้อน (F) และสายส่ง (L)
   ไฟล์เดียว ไม่มี backend · ข้อมูลเก็บใน localStorage (คีย์ขึ้นต้น ramsight_ แยกจากเว็บ RAM Insight เดิมที่อยู่โดเมนเดียวกัน)
   ===================================================================== */
const PFX = 'ramsight_';
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const DEFAULT_MTBF = 4320, DEFAULT_MTTR = 18;
const VIEWS = { month:{ m:720, r:12, name:'รายเดือน' }, year:{ m:8760, r:24, name:'รายปี' } };
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const COMP_NONE = ['', '-', '–', 'ไม่ระบุ', 'ชั่วคราว', 'ชั่วคราว/ไม่ระบุ'];
const CAUSE_UNKNOWN = 'ไม่ทราบสาเหตุ';
const FIELDS = ['date','group','line','feeder','from','to','time_ocb','time_eq','t_cause','relay','lateral','t_componen'];

/* ---------------- storage ---------------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(PFX+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PFX+k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(PFX+k); }catch(e){} }
};
const sess = {
  get(){ try{ return sessionStorage.getItem(PFX+'session') || ''; }catch(e){ return ''; } },
  set(v){ try{ v ? sessionStorage.setItem(PFX+'session', v) : sessionStorage.removeItem(PFX+'session'); }catch(e){} }
};
function readSeed(){
  try{ const s = JSON.parse(document.getElementById('seedData').textContent || '{}'); return { rows: s.rows || [], source: s.source || '' }; }
  catch(e){ return { rows: [], source: '' }; }
}
const DEFAULT_SETTINGS = { threshold: 96, ramHrs: 2, stations: [ { code:'LB', name:'ลาดกระบัง' }, { code:'CG', name:'ฉลองกรุง' }, { code:'LK', name:'ลาดกระบัง' }, { code:'CK', name:'ฉลองกรุง' } ] };

/* ---------------- state ---------------- */
let DATA = store.get('data', null) || readSeed();          // { rows:[raw rows], source, uploadedAt }
let SETTINGS = Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
let MODEL = null;
const S = {
  page: 'home', grp: 'F', stn: 'ALL', sheet: 'ALL', admin: null, dirty: false,
  home: { q:'', unit:'', comp:'', dim:'', open: new Set() },
  plan: null, py: { status:'idle', result:null, err:'' }, charts: {}
};
function resetPlan(){
  S.plan = { mode:'goal', view:'month', unit:'', comp:'', vals:{R:'',M:'',A:''}, user:{R:false,M:false,A:false},
             fix:'mttr', fixVal:'', sMtbf:null, sMttr:null, sView:'month', cost:20000 };
}
resetPlan();

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = v => typeof v === 'number' && isFinite(v);
function fmt(v, d = 1){ return fin(v) ? v.toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d }) : '–'; }
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
const ic = (n, st = '') => `<svg class="ic" ${st ? `style="${st}"` : ''}><use href="#i-${n}"/></svg>`;
const info = k => `<button class="info" type="button" data-info="${k}" aria-label="คำอธิบาย">i</button>`;
const pad = n => String(n).padStart(2, '0');
function fmtDate(ms){ if(!fin(ms)) return '–'; const d = new Date(ms); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543}`; }
function fmtTime(ms){ if(!fin(ms)) return '–'; const d = new Date(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function fmtDT(ms){ return fin(ms) ? fmtDate(ms) + ' ' + fmtTime(ms) : '–'; }
function monLabel(ym){ const [y, m] = ym.split('-').map(Number); return TH_MON[m-1] + ' ' + ((y + 543) % 100); }
function qLabel(yq){ const [y, q] = yq.split('-Q').map(Number); return `ไตรมาส ${q}/${(y + 543) % 100}`; }
/* สถานีที่แสดง = รหัสที่พบในข้อมูล + สถานีที่แอดมินเพิ่มเอง (เรียงตามลำดับในตั้งค่า) */
function stationCodes(){
  const set = new Set((MODEL ? MODEL.events : []).map(e => e.stn));
  SETTINGS.stations.forEach(st => { if(st.added) set.add(st.code); });
  const ord = c => { const i = SETTINGS.stations.findIndex(x => x.code === c); return i < 0 ? 999 : i; };
  return [...set].sort((a, b) => ord(a) - ord(b) || a.localeCompare(b));
}
function stnName(code){ const s = SETTINGS.stations.find(x => x.code === code); return s ? s.name : (code || 'ไม่ระบุ'); }
function compLabel(c){ return COMP_NONE.includes(String(c || '').trim()) ? 'ไม่ระบุ' : c; }
function hashPw(name, pw){ // ไม่ใช่การเข้ารหัสจริง กันการกดพลาดเท่านั้น
  const str = String(name).trim().toLowerCase() + '|' + pw; let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function audit(act, detail = ''){
  const log = store.get('audit', []); log.push({ t: Date.now(), who: S.admin || '-', act, detail });
  store.set('audit', log.slice(-500));
}

/* ---------------- time parsing (เวลาแบบ wall-clock เก็บเป็น UTC ms, ปัดเป็นนาที) ---------------- */
function toMs(v){
  if(v === null || v === undefined || v === '') return NaN;
  let ms = NaN;
  if(typeof v === 'number') ms = (v - 25569) * 86400000;                 // Excel serial (นับจาก 1899-12-30)
  else if(v instanceof Date) ms = Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes(), v.getSeconds());
  else {
    const s = String(v).trim(); let m;
    if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$/)))
      ms = Date.UTC(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    else if((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$/))){
      let y = +m[3];
      if(m[3].length === 2) y = y <= 50 ? 2000 + y : 2500 + y;   // ปี 2 หลัก: ≤ 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
      if(y > 2400) y -= 543;
      ms = Date.UTC(y, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    } else if(/^\d+(\.\d+)?$/.test(s)) ms = (parseFloat(s) - 25569) * 86400000;
  }
  return fin(ms) ? Math.round(ms / 60000) * 60000 : NaN;
}
const msToSerial = ms => ms / 86400000 + 25569;
/* ไฟล์จริงบางชุด from/to มีแค่เวลา (เช่น 08:35) ส่วนวันที่อยู่คอลัมน์ date → รวมกันเอง */
const TIME_RE = /^(\d{1,2})[:.](\d{2})(?::(\d{2}))?\s*(?:น\.?)?$/;
function isTimeOnly(v){
  if(typeof v === 'number') return v >= 0 && v < 1;
  const m = String(v == null ? '' : v).trim().match(TIME_RE); return !!m && +m[1] < 24;
}
function todMs(v){
  if(typeof v === 'number') return Math.round(v * 1440) * 60000;
  const m = String(v).trim().match(TIME_RE); return (+m[1] * 60 + +m[2]) * 60000;
}
function rowTimes(r){
  const fo = isTimeOnly(r.from), to = isTimeOnly(r.to);
  if(!fo && !to) return [toMs(r.from), toMs(r.to)];
  const d = toMs(r.date); if(!fin(d)) return [NaN, NaN];
  const day = Math.floor(d / 86400000) * 86400000;
  const f = fo ? day + todMs(r.from) : toMs(r.from);
  let t = to ? day + todMs(r.to) : toMs(r.to);
  if(to && fin(f) && t < f) t += 86400000;                             // ไฟกลับหลังเที่ยงคืน = วันถัดไป
  return [f, t];
}
const rowKey = r => { const [f, t] = rowTimes(r); return [r.group, r.line, r.feeder, fin(f) ? f : 'x' + r.from, fin(t) ? t : 'x' + r.to].join('|'); };

/* ---------------- Excel reading ---------------- */
function normKey(k){ return String(k).trim().toLowerCase().replace(/\s+/g, '_'); }
const KEY_ALIAS = { t_component:'t_componen', component:'t_componen', cause:'t_cause', timeocb:'time_ocb', time_ocb_:'time_ocb', timeeq:'time_eq', grp:'group' };
/* หาแถวหัวตาราง: แถวแรก (ใน 15 แถวแรก) ที่มีคอลัมน์ที่รู้จักอย่างน้อย 3 คอลัมน์ รองรับไฟล์ที่มีชื่อฟอร์ม/หัวกระดาษอยู่ด้านบน */
const colKey = k => { const nk = normKey(k); return KEY_ALIAS[nk] || nk; };
function headerRow(wb, name){
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:true, blankrows:true });
  for(let i = 0; i < Math.min(15, aoa.length); i++){ if(aoa[i].filter(k => FIELDS.includes(colKey(k))).length >= 3) return { idx: i, cols: aoa[i].map(colKey).filter(k => FIELDS.includes(k)) }; }
  return { idx: 0, cols: (aoa[0] || []).map(colKey).filter(k => FIELDS.includes(k)) };
}
function sheetCols(wb, name){ return headerRow(wb, name).cols; }
function sheetRows(wb, name){
  const h = headerRow(wb, name);
  const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:'', raw:true, range: h.idx });
  return json.map(r => {
    const o = { sheet: name };
    Object.keys(r).forEach(k => { const nk = colKey(k); if(FIELDS.includes(nk) && !(nk in o)) o[nk] = r[k]; });
    FIELDS.forEach(f => { if(!(f in o)) o[f] = ''; });
    ['group','line','feeder','t_cause','t_componen','relay','lateral'].forEach(f => { if(typeof o[f] === 'string') o[f] = o[f].trim(); });
    o.group = String(o.group).toUpperCase();
    return o;
  }).filter(o => o.group === 'F' || o.group === 'L' || o.feeder || o.line);
}

/* ---------------- cleaning + model ---------------- */
function prefixOf(code){ const m = String(code || '').trim().match(/^([A-Za-z]+)/); return m ? m[1].toUpperCase() : ''; }
function classifyRam(cause, comp, dur){
  if(cause === CAUSE_UNKNOWN || COMP_NONE.includes(String(comp || '').trim())) return 'A';
  if(dur > SETTINGS.ramHrs) return 'M';
  return 'R';
}
function buildModel(rawRows){
  const sheetCount = {}; rawRows.forEach(r => { sheetCount[r.sheet] = (sheetCount[r.sheet] || 0) + 1; });
  // 1) ตัดแถวซ้ำ: group + line + feeder + from + to
  const map = new Map(), order = [];
  rawRows.forEach(r => {
    const [f, t] = rowTimes(r);
    const key = [r.group, r.line, r.feeder, fin(f) ? f : 'x' + r.from, fin(t) ? t : 'x' + r.to].join('|');
    if(!map.has(key)){ map.set(key, { r, f, t, sheets:[r.sheet] }); order.push(key); }
    else map.get(key).sheets.push(r.sheet);
  });
  const uniq = order.map(k => { const u = map.get(k); u.sheet = u.sheets.reduce((a, b) => sheetCount[b] < sheetCount[a] ? b : a); return u; });
  const ex = { missing:0, reversed:0, zero:0, long:0 }, exSample = { missing:[], reversed:[], zero:[], long:[] };
  const good = [];
  const bad = (k, u) => { ex[k]++; if(exSample[k].length < 3) exSample[k].push(u.r); };
  uniq.forEach(u => {
    if(!fin(u.f) || !fin(u.t)){ bad('missing', u); return; }          // 2) ไม่มีเวลา
    if(u.t === u.f){ ex.zero++; if(exSample.zero.length < 3) exSample.zero.push(u.r); u.zero = true; good.push(u); return; } // from = to: เก็บไว้ (ดับ 0 นาทีตามที่กรอก) + ติดธงคุณภาพข้อมูล
    if(u.t < u.f){ bad('reversed', u); return; }                       // 3) to < from (ย้อนศร)
    if((u.t - u.f) / 3600000 > 8760){ bad('long', u); return; }        // 4) ดับเกิน 1 ปี
    good.push(u);
  });
  const F = good.filter(u => u.r.group === 'F'), L = good.filter(u => u.r.group === 'L');
  // สถานีของสายส่ง: ดูจากรหัสสายป้อนที่ดับพร้อมกัน (เสียงข้างมาก)
  const lineVotes = {};
  L.forEach(u => { const p = prefixOf(u.r.feeder); if(p){ const v = lineVotes[u.r.line] = lineVotes[u.r.line] || {}; v[p] = (v[p] || 0) + 1; } });
  const lineStn = {}; Object.keys(lineVotes).forEach(l => { lineStn[l] = Object.entries(lineVotes[l]).sort((a, b) => b[1] - a[1])[0][0]; });
  const events = []; let id = 0;
  F.forEach(u => {
    const dur = (u.t - u.f) / 3600000, r = u.r;
    events.push({ id: 'e' + (id++), grp:'F', unit: r.feeder || '(ไม่ระบุสาย)', stn: prefixOf(r.feeder) || '?', from: u.f, to: u.t, dur,
      cause: r.t_cause || '', comp: r.t_componen || '', sheet: u.sheet, raw: r, rawRows: [r], q: u.zero ? 1 : 0, ram: classifyRam(r.t_cause, r.t_componen, dur) });
  });
  // 5) สายส่ง: รวมแถวที่ line + from เดียวกันเป็น 1 เหตุ
  const lg = new Map();
  L.forEach(u => { const k = u.r.line + '|' + u.f; if(!lg.has(k)) lg.set(k, []); lg.get(k).push(u); });
  lg.forEach(arr => {
    const f = arr[0].f, dur = mean(arr.map(u => (u.t - u.f) / 3600000)), r = arr[0].r;
    events.push({ id: 'e' + (id++), grp:'L', unit: r.line || '(ไม่ระบุสาย)', stn: lineStn[r.line] || prefixOf(r.line) || '?', from: f, to: f + dur * 3600000, dur,
      cause: r.t_cause || '', comp: r.t_componen || '', sheet: arr[0].sheet, raw: r, rawRows: arr.map(u => u.r), q: arr.filter(u => u.zero).length, ram: classifyRam(r.t_cause, r.t_componen, dur) });
  });
  events.sort((a, b) => a.from - b.from);
  events.forEach(e => { const d = new Date(e.from); e.ym = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); e.yq = d.getUTCFullYear() + '-Q' + (Math.floor(d.getUTCMonth() / 3) + 1); e.yy = String(d.getUTCFullYear()); });
  const sheetOrder = []; uniq.forEach(u => { if(!sheetOrder.includes(u.sheet)) sheetOrder.push(u.sheet); });
  return { rawCount: rawRows.length, uniqCount: uniq.length, dupes: rawRows.length - uniq.length, rowsF: F.length, rowsL: L.length, ex, exSample, events, sheets: sheetOrder, lineStn };
}

/* สูตร: จัดกลุ่มตาม สถานี+รหัสสาย, MTBF ของแต่ละเหตุ = from(i) − to(i−1) (> 0) */
function computeUnits(evs){
  const g = new Map();
  evs.forEach(e => { const k = e.grp + '|' + e.stn + '|' + e.unit; if(!g.has(k)) g.set(k, []); g.get(k).push(e); });
  const units = [], per = new Map();
  g.forEach((arr, k) => {
    arr.sort((a, b) => a.from - b.from);
    const gaps = [];
    arr.forEach((e, i) => {
      let gap = NaN;
      if(i > 0){ const gp = (e.from - arr[i-1].to) / 3600000; if(gp > 0){ gap = gp; gaps.push(gp); } }
      per.set(e.id, { gap, first: i === 0 });
    });
    const mtbf = mean(gaps), mttr = mean(arr.map(e => e.dur));
    const A = fin(mtbf) ? mtbf / (mtbf + mttr) * 100 : NaN;
    arr.forEach(e => { const p = per.get(e.id); p.mtbf = mtbf; p.A = fin(mtbf) ? mtbf / (mtbf + e.dur) * 100 : NaN; });
    units.push({ key:k, unit: arr[0].unit, stn: arr[0].stn, grp: arr[0].grp, events: arr, n: arr.length, mtbf, mttr, A, gaps });
  });
  units.sort((a, b) => b.n - a.n || (fin(a.A) ? a.A : 999) - (fin(b.A) ? b.A : 999) || a.unit.localeCompare(b.unit));
  return { units, per };
}
function stats(evs){
  const { units, per } = computeUnits(evs);
  const mt = [], av = [], gaps = [];
  evs.forEach(e => { const p = per.get(e.id); if(fin(p.mtbf)){ mt.push(p.mtbf); av.push(p.A); } if(fin(p.gap)) gaps.push(p.gap); });
  const ram = { R:0, A:0, M:0 }, comp = {}, cause = {};
  evs.forEach(e => { ram[e.ram]++; const c = compLabel(e.comp); comp[c] = (comp[c] || 0) + 1; if(e.cause) cause[e.cause] = (cause[e.cause] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
  return { n: evs.length, nQ: evs.filter(e => e.q).length, units, per, nUnits: units.length, mtbfH: mean(mt), pooledH: mean(gaps), mttrH: mean(evs.map(e => e.dur)), A: mean(av), nA: av.length, ram, comp: top(comp), cause: top(cause) };
}
function scoped(opts = {}){
  if(!MODEL) return [];
  const grp = opts.grp || S.grp, stn = opts.stn !== undefined ? opts.stn : S.stn, sheet = opts.sheet !== undefined ? opts.sheet : S.sheet;
  return MODEL.events.filter(e => e.grp === grp && (stn === 'ALL' || e.stn === stn) && (sheet === 'ALL' || e.sheet === sheet));
}

function unitWhy(name, n, nGaps, what = 'MTBF', scope = scopeTxt()){
  const pre = what === 'A' ? 'A = MTBF ÷ (MTBF + MTTR) เมื่อหา MTBF ไม่ได้ จึงคำนวณ A ไม่ได้<br><br>' : '';
  if(n < 2) return pre + `<b>${esc(name)}</b> มีเหตุเพียง 1 ครั้งในขอบเขตนี้ (${esc(scope)})<br>MTBF ต้องมีอย่างน้อย 2 เหตุ เพื่อวัดช่วงเวลาจากไฟกลับของเหตุก่อนหน้า ถึงเวลาเริ่มของเหตุถัดไป` + (scope === scopeTxt() ? tipSheet() : '');
  return pre + `<b>${esc(name)}</b> มี ${n} เหตุ แต่ทุกเหตุเริ่มก่อนหรือพร้อมเวลาไฟกลับของเหตุก่อนหน้า (เวลาทับซ้อนกัน) จึงไม่มีช่วงห่างที่มากกว่า 0 ให้นำมาหา MTBF<br>ควรตรวจเวลา from/to ของสายนี้ในไฟล์ต้นฉบับ`;

function openEvent(id){

  let body = `<dl class="kv">
    ${kv('สาย', `<b>${esc(e.unit)}</b> · ${e.grp === 'F' ? 'สายป้อน' : 'สายส่ง'} · ${esc(stnName(e.stn))} (${esc(e.stn)})`)}
    ${kv('เริ่มดับ (from)', fmtDT(e.from))}${kv('ไฟกลับ (to)', fmtDT(e.to) + (e.grp === 'L' && e.rawRows.length > 1 ? ' <span class="note">(from + ค่าเฉลี่ยระยะเวลาดับ)</span>' : ''))}

    ${kv('ช่วงห่างจากเหตุก่อน', fin(st.gap) ? fmt(st.gap, 1) + ' ชม.' : st.first ? dash(`เหตุนี้เป็นเหตุแรกของ ${esc(e.unit)} ในข้อมูล จึงไม่มีเหตุก่อนหน้าให้วัดช่วงห่าง`) : dash(`เหตุนี้เริ่มก่อนหรือพร้อมเวลาไฟกลับของเหตุก่อนหน้าในสายเดียวกัน (เวลาทับซ้อน) ช่วงห่างจึงไม่มากกว่า 0 และไม่นำมาคิด MTBF`))}
    ${kv('มิติ', `<span class="tag t${e.ram}">${e.ram}</span>`)}
    ${kv('สาเหตุ (t_cause)', e.cause ? esc(e.cause) : dash('แถวนี้ไม่ได้กรอกสาเหตุ (คอลัมน์ t_cause ว่าง)'))}${kv('ชิ้นส่วน (t_componen)', esc(compLabel(e.comp)))}
    ${kv('ชีต', esc(e.sheet))}</dl>`;
  if(e.grp === 'F'){
    body += `<dl class="kv" style="border-top:1px solid var(--line);padding-top:12px">${['time_ocb','time_eq','relay','lateral'].map(k => kv(k, r[k] === '' || r[k] == null ? dash(`แถวนี้ไม่ได้กรอกค่าในคอลัมน์ ${k} ของไฟล์ Excel`) : esc(r[k]))).join('')}</dl>`;
  } else {
    body += `<div class="lbl" style="margin-top:4px">แถวดิบที่รวมเป็นเหตุนี้ (rawRows) · ${e.rawRows.length} แถว</div><div class="tbl-wrap"><table><thead><tr><th>feeder</th><th>from</th><th>to</th><th class="n">ดับ (ชม.)</th><th>relay</th><th>lateral</th></tr></thead><tbody>
      ${e.rawRows.map(x => { const [f, t] = rowTimes(x); return `<tr><td>${x.feeder ? esc(x.feeder) : dash('แถวนี้ไม่ได้กรอกรหัสสายป้อน (feeder)')}</td><td>${fmtDT(f)}</td><td>${fmtDT(t)}</td><td class="n">${fmt((t - f) / 3600000, 2)}</td><td>${x.relay ? esc(x.relay) : dash('แถวนี้ไม่ได้กรอก relay')}</td><td>${x.lateral ? esc(x.lateral) : dash('แถวนี้ไม่ได้กรอก lateral')}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  openModal('รายละเอียดเหตุ', body, S.admin ? `<button class="btn danger" data-delev="${e.id}">${ic('trash')}ลบเหตุนี้</button><button class="btn" data-close>ปิด</button>` : `<button class="btn" data-close>ปิด</button>`, true);
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-ev]'); if(r){ openEvent(r.dataset.ev); return; }
  const d = e.target.closest('[data-delev]');
  if(d){
    const ev = MODEL.events.find(x => x.id === d.dataset.delev); if(!ev) return;
    if(!confirm(`ลบเหตุของ ${ev.unit} วันที่ ${fmtDT(ev.from)} (${ev.rawRows.length} แถว)?`)) return;
    const del = new Set(ev.rawRows.map(rowKey));
    DATA.rows = DATA.rows.filter(x => !del.has(rowKey(x)));
    audit('ลบเหตุ', `${ev.unit} ${fmtDT(ev.from)}`);
    closeModal(); markDirty(); rebuild();
  }
});

function gaugeSvg(v, tgt){
  const lo = Math.min(90, Math.floor(Math.min(fin(v) ? v : 90, tgt) / 10) * 10), hi = 100, cx = 150, cy = 135, r = 100;
  const ang = x => Math.PI * (1 - Math.min(1, Math.max(0, (x - lo) / (hi - lo)))), pt = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  let s = ''; const N = 40;
  for(let i = 0; i < N; i++){
    const a0 = Math.PI * (1 - i / N), a1 = Math.PI * (1 - (i + 1) / N), x = lo + (hi - lo) * (i + .5) / N, t = Math.max(0, Math.min(1, (x - lo) / Math.max(.001, tgt - lo)));
    const c = x >= tgt ? '#3a9a66' : `rgb(${Math.round(200 - t * 20)},${Math.round(110 + t * 60)},90)`;
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1 + .004, r);
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${c}" stroke-width="20" fill="none"/>`;
  }
  [[lo, Math.PI], [hi, 0]].forEach(([l, a]) => { const [x, y] = pt(a, r + 30); s += `<text x="${x}" y="${y + 4}" font-size="12" fill="#8a96ad" text-anchor="middle">${l}%</text>`; });
  const [t0x, t0y] = pt(ang(tgt), r - 16), [t1x, t1y] = pt(ang(tgt), r + 16), [tlx, tly] = pt(ang(tgt), r + 28);
  s += `<line x1="${t0x}" y1="${t0y}" x2="${t1x}" y2="${t1y}" stroke="#14213d" stroke-width="3"/><text x="${tlx}" y="${tly}" font-size="12" fill="#14213d" text-anchor="middle" font-weight="600">${tgt}%</text>`;
  if(fin(v)){ const [nx, ny] = pt(ang(v), r - 18); s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#0b2160" stroke-width="4" stroke-linecap="round"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="8" fill="#0b2160"/>`;
  return `<svg viewBox="0 0 300 150" width="100%" style="max-width:320px" role="img" aria-label="Availability ${fmt(v, 2)}%">${s}</svg>`;
}
const RAM_META = [['R','Reliability','#2563eb'], ['A','Availability','#2e8b57'], ['M','Maintainability','#e07a1f']];
function donutSvg(ram, T){
  let a = -Math.PI / 2, s = ''; const r = 78, cx = 95, cy = 95;
  RAM_META.forEach(([k, , c]) => {
    const v = ram[k]; if(!v) return;
    const frac = v / T, b = a + 2 * Math.PI * frac;
    if(frac >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${c}" stroke-width="30" fill="none" data-drill="ram" data-val="${k}" style="cursor:pointer"/>`;
    else { const l = (b - a) > Math.PI ? 1 : 0, gap = Math.min(.012, (b - a) / 4);
      s += `<path d="M${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}A${r} ${r} 0 ${l} 1 ${(cx + r * Math.cos(b - gap)).toFixed(2)} ${(cy + r * Math.sin(b - gap)).toFixed(2)}" stroke="${c}" stroke-width="30" fill="none" data-drill="ram" data-val="${k}" style="cursor:pointer"><title>${k}: ${v}</title></path>`; }
    a = b;
  });
  return `<svg width="190" height="190" viewBox="0 0 190 190">${s}<text x="95" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#14213d">${T}</text><text x="95" y="118" text-anchor="middle" font-size="12.5" fill="#5d6b86">เหตุทั้งหมด</text></svg>`;
}

       <div><b style="color:var(--Atx)">A = MTBF ÷ (MTBF + MTTR) × 100</b>${o.R && o.M ? `<br>= ${fmt(o.R.mtbf, 1)} ÷ (${fmt(o.R.mtbf, 1)} + ${fmt(o.M.mttr, 2)}) = ${fmt(o.R.mtbf / (o.R.mtbf + o.M.mttr) * 100, 2)}%` : ''}<br>ตรึง MTTR: MTBF = (A/100 × MTTR) ÷ (1 − A/100)<br>ตรึง MTBF: MTTR = MTBF × (100 − A) ÷ A</div>`;
  const wasOpen = out.querySelector('details.fx') ? out.querySelector('details.fx').open : false;
  out.innerHTML = (o.err.length ? `<div class="errbox">${o.err.join('<br>')}</div>` : '') +
    `<div class="grid g3">${cR}${cM}${cA}</div>
     <details class="card fx" ${wasOpen ? 'open' : ''}><summary><span style="display:flex;gap:8px;align-items:center">${ic('fx')}ดูสูตรที่ใช้</span>${ic('chev', '').replace('class="ic"', 'class="ic chev"')}</summary>
       <div class="grid g3" style="margin-top:14px;font-size:14px;color:var(--soft);line-height:1.7">${fx}</div>
       <div class="note" style="margin-top:10px">e = เลขเนเปียร์ (≈ 2.71828) · รายเดือน t = 720 ชม. (R) / 12 ชม. (M) · รายปี t = 8,760 ชม. (R) / 24 ชม. (M)</div></details>`;
}
function paintSlide(out){
  const P = S.plan, B = planBase();
  if(P.sMtbf === null) P.sMtbf = B.mtbf;
  if(P.sMttr === null) P.sMttr = B.mttr;
  const maxB = Math.ceil(Math.max(B.mtbf * 3, 1000) / 100) * 100, maxR = Math.ceil(Math.max(B.mttr * 3, 24));
  const V = VIEWS[P.sView];
  const calc = (mtbf, mttr) => { const A = mtbf / (mtbf + mttr) * 100, dt = 8760 * (1 - A / 100); return { R: Math.exp(-V.m / mtbf) * 100, M: (1 - Math.exp(-V.r / mttr)) * 100, A, dt, cost: dt * P.cost }; };
  const a = calc(B.mtbf, B.mttr), b = calc(P.sMtbf, P.sMttr);
  const pc = v => v >= 99.995 && v < 100 ? fmt(v, 3) : fmt(v, 2);
  const row = (lab, col, x, y, f, better) => `<div class="cmp"><span style="color:${col};font-weight:600">${lab}</span><span class="a">${f(x)}</span><span class="b" style="color:${better === undefined || Math.abs(y - x) < 1e-9 ? 'var(--text)' : better ? 'var(--Atx)' : 'var(--bad)'}">${f(y)}</span></div>`;
  out.innerHTML = `<div class="card">
    <div class="bar"><h3>ปรับค่าจำลอง ${esc(B.u ? B.src : '(ค่าเริ่มต้น)')}</h3><div class="right seg"><button data-sview="month" class="${P.sView === 'month' ? 'on' : ''}">รายเดือน</button><button data-sview="year" class="${P.sView === 'year' ? 'on' : ''}">รายปี</button></div></div>
    <div class="grid g2" style="margin-top:10px;gap:28px">
      <div>
        <div class="lbl" style="margin-top:8px;display:flex;justify-content:space-between">MTBF (ชม.) <input type="number" class="fld" id="sMtbfN" value="${+P.sMtbf.toFixed(1)}" min="1" step="any" style="width:120px;padding:4px 8px;text-align:right"></div>
        <input type="range" class="slider" id="sMtbf" min="1" max="${maxB}" step="1" value="${Math.min(P.sMtbf, maxB)}">
        <div class="note">ปัจจุบัน ${fmt(B.mtbf, 1)} ชม.</div>
        <div class="lbl" style="margin-top:16px;display:flex;justify-content:space-between">MTTR (ชม.) <input type="number" class="fld" id="sMttrN" value="${+P.sMttr.toFixed(2)}" min="0.01" step="any" style="width:120px;padding:4px 8px;text-align:right"></div>
        <input type="range" class="slider m" id="sMttr" min="0.1" max="${maxR}" step="0.1" value="${Math.min(P.sMttr, maxR)}">
        <div class="note">ปัจจุบัน ${fmt(B.mttr, 2)} ชม.</div>
        <div class="lbl" style="margin-top:16px">ค่าเสียหายต่อชั่วโมงที่ไฟดับ <span style="color:var(--M)">(ค่าสมมติ)</span></div>
        <div class="inp"><input type="number" id="sCost" value="${P.cost}" min="0" step="1000" style="font-size:16px;padding-right:70px"><span>บาท/ชม.</span></div>
        <div class="note" style="margin-top:4px">20,000 บาท/ชม. เป็นค่าสมมติเพื่อดูผลกระทบ ไม่ใช่ตัวเลขจริงขององค์กร</div>
      </div>
      <div><div class="cmp" style="font-size:13px;color:var(--faint)"><span>${V.name} (t = ${V.m.toLocaleString('en-US')} / ${V.r} ชม.)</span><span style="text-align:right">ปัจจุบัน</span><span style="text-align:right">หลังปรับ</span></div>
        ${row('R', 'var(--R)', a.R, b.R, v => fmt(v, 2) + '%', b.R > a.R)}
        ${row('M', 'var(--Mtx)', a.M, b.M, v => pc(v) + '%', b.M > a.M)}
        ${row('A', 'var(--Atx)', a.A, b.A, v => fmt(v, 2) + '%', b.A > a.A)}
        ${row('Downtime ต่อปี', 'var(--text)', a.dt, b.dt, v => fmt(v, 1) + ' ชม.', b.dt < a.dt)}
        ${row('ค่าเสียหายต่อปี', 'var(--text)', a.cost, b.cost, v => '฿' + fmt(v, 0), b.cost < a.cost)}
        <div class="note" style="margin-top:8px">Downtime ต่อปี = 8,760 × (1 − A/100) · λ = 1/MTBF = ${fmt(1 / P.sMtbf, 5)} ครั้ง/ชม. · μ = 1/MTTR = ${fmt(1 / P.sMttr, 3)} ครั้ง/ชม.</div></div>
    </div></div>`;
  const set = (k, v, re) => { const x = parseFloat(v); if(fin(x) && x > 0){ P[k] = x; if(re) paintSlide(out); else { paintSlide(out); } } };
  $('sMtbf').addEventListener('input', e => { P.sMtbf = +e.target.value; paintSlide(out); $('sMtbf').focus(); });
  $('sMttr').addEventListener('input', e => { P.sMttr = +e.target.value; paintSlide(out); $('sMttr').focus(); });
  $('sMtbfN').addEventListener('change', e => set('sMtbf', e.target.value));
  $('sMttrN').addEventListener('change', e => set('sMttr', e.target.value));
  $('sCost').addEventListener('change', e => { const x = parseFloat(e.target.value); P.cost = fin(x) && x >= 0 ? x : 0; paintSlide(out); });
}
document.addEventListener('click', e => {

  else if(t.dataset.sview){ P.sView = t.dataset.sview; paintPlan(); }
});

/* ---------- Pareto (หลัก 80/20) ---------- */
S.rank = { pareto:'cause' };
S.cmp = { a:'', b:'' };
const PARETO_BY = { cause:['สาเหตุ', e => e.cause || 'ไม่ได้กรอกสาเหตุ'], comp:['ชิ้นส่วน', e => compLabel(e.comp)], unit:['สาย', e => e.unit] };
function paretoData(evs, by){
  const keyf = PARETO_BY[by][1], o = {};
  evs.forEach(e => { const k = keyf(e); (o[k] = o[k] || []).push(e); });
  let arr = Object.entries(o).map(([k, list]) => ({ k, n: list.length, list })).sort((a, b) => b.n - a.n || a.k.localeCompare(b.k));
  const MAX = 12;
  if(arr.length > MAX){ const rest = arr.slice(MAX - 1); arr = arr.slice(0, MAX - 1).concat([{ k: `อื่น ๆ (${rest.length} รายการ)`, n: rest.reduce((t, r) => t + r.n, 0), list: rest.flatMap(r => r.list), other: true }]); }
  const T = evs.length; let cum = 0;
  arr.forEach(a => { a.before = cum / T * 100; cum += a.n; a.cum = cum / T * 100; a.pct = a.n / T * 100; a.vital = a.before < 80 && !a.other; });
  return arr;
}
function paintPareto(evs){
  const el = $('paretoCard'); if(!el) return; destroyChart('pareto');

  const vitalPct = vital.length ? vital[vital.length - 1].cum : 0;
  el.innerHTML = `<div class="bar"><h3>Pareto · ${PARETO_BY[by][0]}ที่ทำให้เกิดเหตุ (หลัก 80/20) ${info('pareto')}</h3>
      <div class="right seg no-print">${Object.entries(PARETO_BY).map(([k, v]) => `<button data-pareto="${k}" class="${by === k ? 'on' : ''}">${v[0]}</button>`).join('')}</div></div>
    <div class="sub">แท่ง = จำนวนเหตุ (เรียงมากไปน้อย) · เส้น = % สะสม · เส้นประ = 80% · แท่งสีเข้ม = กลุ่มที่ควรแก้ก่อน · คลิกแท่งเพื่อดูรายการ</div>
    <div class="chart-box" style="height:320px;margin-top:12px"><canvas id="paretoCv"></canvas></div>
    ${vital.length ? `<div class="warnbox" style="background:#f5f8fe;border-color:var(--line);color:var(--text);margin-top:12px">
      <b>${vital.length} ${PARETO_BY[by][0]}แรก</b> จากทั้งหมด ${nCat} ${PARETO_BY[by][0]} (${fmt(vital.length / Math.max(1, nCat) * 100, 0)}%) ทำให้เกิด <b>${fmt(vitalPct, 1)}%</b> ของเหตุทั้งหมด ${evs.length} เหตุ:
      ${vital.map(a => `<b>${esc(a.k)}</b> ${a.n}`).join(' · ')}<br><span class="note">ถ้าแก้ที่กลุ่มนี้ได้ จะลดเหตุได้มากที่สุดเมื่อเทียบกับแรงที่ใช้</span></div>` : ''}`;
  if(typeof Chart === 'undefined'){ $('paretoCv').parentNode.innerHTML = '<div class="warnbox">โหลดไลบรารีกราฟไม่ได้ (ต้องใช้อินเทอร์เน็ต)</div>'; return; }
  const short = t => t.length > 16 ? t.slice(0, 15) + '…' : t;
  S.charts.pareto = new Chart($('paretoCv'), {
    data:{ labels: arr.map(a => short(a.k)), datasets:[
      { type:'bar', label:'จำนวนเหตุ', data: arr.map(a => a.n), backgroundColor: arr.map(a => a.vital ? '#1c3a7a' : '#a9bde6'), borderRadius:4, maxBarThickness:46, yAxisID:'y', order:2 },
      { type:'line', label:'% สะสม', data: arr.map(a => +a.cum.toFixed(1)), borderColor:'#e07a1f', backgroundColor:'#e07a1f', pointRadius:3, borderWidth:2, yAxisID:'y1', order:1 },
      { type:'line', label:'80%', data: arr.map(() => 80), borderColor:'#c2413b', borderDash:[5, 4], borderWidth:1.5, pointRadius:0, yAxisID:'y1', order:0 } ] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ title: it => arr[it[0].dataIndex].k, label: c => c.datasetIndex === 0 ? `${c.parsed.y} เหตุ (${fmt(arr[c.dataIndex].pct, 1)}%)` : c.datasetIndex === 1 ? `สะสม ${fmt(c.parsed.y, 1)}%` : null } } },
      scales:{ y:{ beginAtZero:true, ticks:{ precision:0, color:'#8a96ad' }, grid:{ color:'#eef2f8' }, title:{ display:true, text:'จำนวนเหตุ', color:'#8a96ad' } },
        y1:{ position:'right', min:0, max:100, ticks:{ callback: v => v + '%', color:'#8a96ad' }, grid:{ display:false } },
        x:{ ticks:{ color:'#5d6b86', font:{ size:11 }, maxRotation:50, minRotation:0, autoSkip:false }, grid:{ display:false } } },
      onClick:(ev, els) => { const b = els.find(x => x.datasetIndex === 0) || els[0]; if(!b) return; const a = arr[b.index]; openEventList(`${PARETO_BY[by][0]}: ${a.k} · ${a.n} เหตุ (${fmt(a.pct, 1)}%)`, a.list.slice().sort((x, y) => y.from - x.from)); },

  });
}

/* ---------- เปรียบเทียบช่วงเวลา ---------- */
function cmpPeriods(){
  const evs = scoped({ sheet:'ALL' });
  const years = [...new Set(evs.map(e => e.yy))].sort();
  const sheets = MODEL.sheets.filter(n => evs.some(e => e.sheet === n));
  const opts = years.map(y => ({ v:'Y:' + y, label:`ปี ${+y + 543} (${y})` })).concat(sheets.map(n => ({ v:'S:' + n, label:'ชีต ' + n })));
  return { evs, years, sheets, opts };
}
function cmpPick(evs, v){ const [t, x] = [v.slice(0, 1), v.slice(2)]; return evs.filter(e => t === 'Y' ? e.yy === x : e.sheet === x); }
function cmpLabel(v){ return v.startsWith('Y:') ? `ปี ${+v.slice(2) + 543}` : 'ชีต ' + v.slice(2); }
function paintCompare(){
  const el = $('cmpCard'); if(!el) return;
  const P = cmpPeriods(), C = S.cmp;
  const valid = v => P.opts.some(o => o.v === v);
  if(!valid(C.a) || !valid(C.b)){
    if(P.years.length >= 2){ C.a = 'Y:' + P.years[P.years.length - 2]; C.b = 'Y:' + P.years[P.years.length - 1]; }
    else if(P.sheets.length >= 2){ C.a = 'S:' + P.sheets[P.sheets.length - 2]; C.b = 'S:' + P.sheets[P.sheets.length - 1]; }
  }
  const head = `<div class="bar"><h3>เปรียบเทียบช่วงเวลา · ${grpWord()} ${info('compare')}</h3></div>`;

const PY_CODE = document.getElementById('pyCode').textContent.replace(/^\n/, '');
function jsValues(){
  const f = stats(MODEL.events.filter(e => e.grp === 'F')), l = stats(MODEL.events.filter(e => e.grp === 'L'));
  const topComp = f.comp.find(([c]) => c !== 'ไม่ระบุ') || ['–', 0];
  return { nF: f.n, nL: l.n, nAll: MODEL.events.length, mtbfF: f.mtbfH / 24, mttrF: f.mttrH, AF: f.A, R: f.ram.R, A: f.ram.A, M: f.ram.M, mtbfL: l.mtbfH / 24, AL: l.A, topComp: topComp[0] + ' ' + topComp[1] };
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('load failed')); document.head.appendChild(s); }); }
let pyodideP = null;
async function runPython(){
  S.py = { status:'loading', result:null, err:'' }; renderPy();
  try{
    if(!pyodideP) pyodideP = (async () => { if(typeof loadPyodide === 'undefined') await loadScript(PYODIDE_URL + 'pyodide.js'); return await loadPyodide({ indexURL: PYODIDE_URL }); })();
    const py = await pyodideP.catch(e => { pyodideP = null; throw e; });
    py.globals.set('RAW_JSON', JSON.stringify(DATA.rows));
    py.globals.set('RAM_HRS', SETTINGS.ramHrs);
    const res = JSON.parse(py.runPython(PY_CODE));
    S.py = { status:'done', result: res, err:'' };
    audit('รันตรวจสอบด้วย Python', '');
  }catch(e){
    S.py = { status:'error', result:null, err: String(e && e.message || e) };
  }
  if(S.page === 'py') renderPy();
}

function requireAdmin(){ if(!S.admin){ openLogin(); return false; } return true; }
$('uploadBtn').onclick = () => { if(requireAdmin()) $('fileInput').click(); };
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('โหลดไลบรารีอ่าน Excel ไม่ได้ (ต้องใช้อินเทอร์เน็ตในการเปิดเว็บครั้งแรก)'); return; }
  const rd = new FileReader();
  rd.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
      const sheets = wb.SheetNames.map(n => ({ name:n, rows: sheetRows(wb, n), cols: sheetCols(wb, n) })).filter(s => s.rows.length);
      if(!sheets.length){ alert('ไม่พบแถวข้อมูลที่มีคอลัมน์ group/feeder/line ในไฟล์นี้'); return; }
      if(sheets.length === 1) ingest(sheets, sheets.map(s => s.name), file.name);
      else openSheetPicker(sheets, file.name);
    }catch(err){ alert('อ่านไฟล์ไม่ได้: ' + err.message); }
  };
  rd.readAsArrayBuffer(file);
});
function openSheetPicker(sheets, fname){
  const m = openModal('เลือกชีตที่จะนำเข้า', `<div class="sub">ไฟล์ ${esc(fname)} มี ${sheets.length} ชีต ติ๊กทุกชีตไว้ให้แล้ว ระบบจะตัดแถวซ้ำให้เอง ชีตสรุปที่ซ้ำกับชีตรายเดือนจึงไม่ทำให้นับซ้ำ</div>
    <div style="display:flex;gap:8px"><button class="btn sm" id="pkAll">เลือกทั้งหมด</button><button class="btn sm" id="pkNone">ไม่เลือกเลย</button></div>
    ${sheets.map(s => `<label class="chk-row"><input type="checkbox" checked value="${esc(s.name)}"><span style="flex:1">${esc(s.name)}</span><span class="note">${s.rows.length} แถว</span></label>`).join('')}`,
    `<button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="pkOk">${ic('up')}นำเข้า</button>`);
  const boxes = () => [...m.querySelectorAll('input[type=checkbox]')];
  $('pkAll').onclick = () => boxes().forEach(b => b.checked = true);
  $('pkNone').onclick = () => boxes().forEach(b => b.checked = false);

}
function ingest(sheets, names, fname){
  const rows = []; sheets.filter(s => names.includes(s.name)).forEach(s => rows.push(...s.rows));
  DATA = { rows, source: fname, uploadedAt: Date.now() };
  S.sheet = 'ALL'; S.home.open.clear(); S.py = { status:'idle', result:null, err:'' };
  audit('อัปโหลด Failure Log', `${fname} · ${names.length} ชีต · ${rows.length} แถว`);
  markDirty(); rebuild();
  showImportReport(sheets.filter(s => names.includes(s.name)), fname);
}
function showImportReport(sheets, fname){
  const m = MODEL, nF = m.events.filter(e => e.grp === 'F').length, nL = m.events.filter(e => e.grp === 'L').length;
  const cols = new Set(); sheets.forEach(s => (s.cols || []).forEach(c => cols.add(c)));
  const need = [['group','กลุ่ม F/L'], ['feeder','รหัสสายป้อน'], ['from','เวลาเริ่มดับ'], ['to','เวลาไฟกลับ']].filter(([c]) => !cols.has(c));
  const timeOnly = m.exSample && sheets.some(s => s.rows.slice(0, 20).some(r => isTimeOnly(r.from)));
  const show = v => v === '' || v == null ? '(ว่าง)' : typeof v === 'number' ? (v < 1 ? fmtTime(todMs(v)) : v > 20000 ? fmtDT(toMs(v)) : v) : v;
  const reasons = [['missing','ไม่มีเวลาเริ่มหรือเวลาไฟกลับ (หรืออ่านรูปแบบวันที่ไม่ได้)'], ['reversed','เวลาไฟกลับก่อนเวลาเริ่ม'], ['long','ดับนานเกิน 1 ปี']].filter(([k]) => m.ex[k]);
  const used = nF + nL, droppedAll = m.uniqCount && !used;
  openModal('ผลการนำเข้า', `
    <div class="${droppedAll ? 'errbox' : 'warnbox'}" style="${!droppedAll && !reasons.length && !m.ex.zero ? 'background:var(--Abg);border-color:var(--Abd);color:var(--Atx)' : ''}">
      ${droppedAll ? '<b>ไม่มีแถวที่ใช้คำนวณได้เลย</b> ดูสาเหตุด้านล่าง' : `ใช้คำนวณได้ <b>สายป้อน ${nF} เหตุ · สายส่ง ${nL} เหตุ</b>`}</div>
    <dl class="kv"><dt>ไฟล์</dt><dd>${esc(fname)} · ${sheets.length} ชีต</dd><dt>แถวที่อ่านได้</dt><dd>${m.rawCount} แถว (ซ้ำ ${m.dupes} → เหลือ ${m.uniqCount})</dd>
      <dt>สายป้อน / สายส่ง</dt><dd>${m.rowsF} แถว / ${m.rowsL} แถว → ${nL} เหตุ</dd>
      ${timeOnly ? '<dt>รูปแบบเวลา</dt><dd>from/to มีแค่เวลา ระบบรวมกับคอลัมน์ date ให้ (ถ้าไฟกลับหลังเที่ยงคืน นับเป็นวันถัดไป)</dd>' : ''}</dl>
    ${need.length ? `<div class="errbox">ไม่พบคอลัมน์: ${need.map(([c, n]) => `<b>${c}</b> (${n})`).join(', ')}<br>ชื่อคอลัมน์ต้องตรงกับไฟล์ตัวอย่าง (date, group, line, feeder, from, to, …) และอยู่ใน 15 แถวแรกของชีต</div>` : ''}
    ${reasons.length ? `<div class="lbl" style="margin-top:4px">แถวที่ตัดออก ${reasons.reduce((s, [k]) => s + m.ex[k], 0)} แถว</div>
      <div class="tbl-wrap"><table><thead><tr><th>สาเหตุ</th><th class="n">แถว</th><th>ตัวอย่าง (date · from → to)</th></tr></thead><tbody>
      ${reasons.map(([k, n]) => `<tr><td>${n}</td><td class="n">${m.ex[k]}</td><td class="mono" style="font-size:12px">${m.exSample[k].map(r => `${esc(r.feeder || r.line)} · ${esc(typeof r.date === 'number' && r.date > 20000 ? fmtDate(toMs(r.date)) : show(r.date))} · ${esc(show(r.from))} → ${esc(show(r.to))}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${m.ex.zero ? `<div class="warnbox"><b>เก็บไว้ ${m.ex.zero} แถว</b> ที่เวลาเริ่ม = เวลาไฟกลับ (ไม่ตัดทิ้ง) นับเป็นดับ 0 นาที และติดธง "from = to" ให้เห็นในหน้าหลักและหน้าจัดอันดับ<div class="mono" style="font-size:12px;margin-top:6px">${m.exSample.zero.map(r => `${esc(r.feeder || r.line)} · ${esc(typeof r.date === 'number' && r.date > 20000 ? fmtDate(toMs(r.date)) : show(r.date))} · ${esc(show(r.from))} → ${esc(show(r.to))}`).join('<br>')}</div></div>` : ''}
    <div class="note">ข้อมูลยังไม่ถูกบันทึก กด "บันทึกการเปลี่ยนแปลง" ด้านบนเพื่อเก็บไว้ในเบราว์เซอร์นี้</div>`,
    `<button class="btn pri" data-close>ตกลง</button>`, true);
}

    }

    closeModal(); paintChrome(); renderPage(); toast('เข้าสู่ระบบแล้ว');

    <dt>MTBF</dt><dd>เวลาเฉลี่ยระหว่างเสีย: ช่วงห่างจากไฟกลับของเหตุก่อนหน้า ถึงเวลาเริ่มเหตุถัดไป ของสายเดียวกัน (นับเฉพาะค่า > 0)</dd>

   ['MTTR เฉลี่ย (ชม.)', +f.mttrH.toFixed(2), +l.mttrH.toFixed(2)], ['Availability เฉลี่ย (%)', +f.A.toFixed(2), +l.A.toFixed(2)], ['มิติ R', f.ram.R, l.ram.R], ['มิติ A', f.ram.A, l.ram.A], ['มิติ M', f.ram.M, l.ram.M],

  const f = stats(scoped({ grp:'F' })), l = stats(scoped({ grp:'L' })), fe = scoped({ grp:'F' });
  const kv = (lab, a, b) => `<tr><td>${lab}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`;
  const aTxt = st => fin(st.A) ? `${fmt(st.A, 2)}% ${st.A >= thr ? '✓' : '✗'}` : '–';
  const care = f.units.slice(0, 5), par = paretoData(fe, 'cause').slice(0, 6), comp = paretoData(fe, 'comp').slice(0, 5);
  const qBy = {}; fe.filter(e => e.q).forEach(e => { qBy[e.unit] = (qBy[e.unit] || 0) + 1; });
  const qTop = Object.entries(qBy).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const range = fe.length ? `${monLabel(fe[0].ym)} – ${monLabel(fe[fe.length - 1].ym)}` : '–';
  el.innerHTML = `<div class="rep">
    <div class="rep-head"><img src="${document.querySelector('.logo img').src}" alt=""><div><div class="rep-t">รายงานสรุปความน่าเชื่อถือ ความพร้อมใช้งาน และการซ่อมบำรุง (R/A/M)</div>
      <div class="rep-s">สถานี: ${esc(S.stn === 'ALL' ? stationCodes().map(stnName).join(', ') : stnName(S.stn))} · ข้อมูล: ${esc(S.sheet === 'ALL' ? 'ทุกชีต' : S.sheet)} (${range}) · เกณฑ์ A ≥ ${thr}% · พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</div></div></div>
    <div class="rep-grid">
      <div><div class="rep-h">1. ตัวชี้วัดหลัก</div><table class="rep-tb"><thead><tr><th></th><th class="n">สายป้อน (F)</th><th class="n">สายส่ง (L)</th></tr></thead><tbody>
        ${kv('จำนวนเหตุ', f.n, l.n)}${kv('จำนวนสาย', f.nUnits, l.nUnits)}${kv('MTBF เฉลี่ย', fin(f.mtbfH) ? fmt(f.mtbfH / 24, 1) + ' วัน' : '–', fin(l.mtbfH) ? fmt(l.mtbfH / 24, 1) + ' วัน' : '–')}
        ${kv('MTTR เฉลี่ย', fmt(f.mttrH, 2) + ' ชม.', fmt(l.mttrH, 2) + ' ชม.')}${kv('Availability เฉลี่ย', aTxt(f), aTxt(l))}${kv('R / A / M', `${f.ram.R} / ${f.ram.A} / ${f.ram.M}`, `${l.ram.R} / ${l.ram.A} / ${l.ram.M}`)}
        ${kv('from = to (กรอกไม่ครบ)', `${f.nQ} (${fmt(f.n ? f.nQ / f.n * 100 : 0, 1)}%)`, `${l.nQ} (${fmt(l.n ? l.nQ / l.n * 100 : 0, 1)}%)`)}</tbody></table></div>
      <div><div class="rep-h">2. สายป้อนที่ควรดูแลก่อน (เหตุมากที่สุด)</div><table class="rep-tb"><thead><tr><th>สาย</th><th class="n">เหตุ</th><th class="n">MTBF (ชม.)</th><th class="n">MTTR (ชม.)</th><th class="n">A (%)</th></tr></thead><tbody>
        ${care.map(u => `<tr><td><b>${esc(u.unit)}</b></td><td class="n">${u.n}</td><td class="n">${fmt(u.mtbf, 1)}</td><td class="n">${fmt(u.mttr, 2)}</td><td class="n">${fmt(u.A, 2)}${fin(u.A) && u.A < thr ? ' ✗' : ''}</td></tr>`).join('')}</tbody></table></div>
      <div><div class="rep-h">3. Pareto สาเหตุของเหตุสายป้อน</div><table class="rep-tb"><thead><tr><th>สาเหตุ</th><th class="n">เหตุ</th><th class="n">%</th><th class="n">% สะสม</th></tr></thead><tbody>
        ${par.map(a => `<tr${a.vital ? ' style="font-weight:600"' : ''}><td>${esc(a.k)}</td><td class="n">${a.n}</td><td class="n">${fmt(a.pct, 1)}</td><td class="n">${fmt(a.cum, 1)}</td></tr>`).join('')}</tbody></table>
        <div class="rep-n">ตัวหนา = กลุ่มที่ทำให้เกิดเหตุรวมกันประมาณ 80% ควรแก้ก่อน</div></div>
      <div><div class="rep-h">4. ชิ้นส่วนที่เสียบ่อย</div><table class="rep-tb"><thead><tr><th>ชิ้นส่วน</th><th class="n">เหตุ</th><th class="n">% สะสม</th></tr></thead><tbody>
        ${comp.map(a => `<tr><td>${esc(a.k)}</td><td class="n">${a.n}</td><td class="n">${fmt(a.cum, 1)}</td></tr>`).join('')}</tbody></table>
        <div class="rep-h" style="margin-top:8px">5. คุณภาพการกรอกข้อมูล</div>
        <div class="rep-n" style="font-size:10.5px;color:#14213d">${f.nQ ? `สายป้อนมี <b>${f.nQ}</b> เหตุ (${fmt(f.nQ / f.n * 100, 1)}%) ที่เวลาเริ่ม = เวลาไฟกลับ (ยังไม่ได้กรอกเวลาจริง) มากที่สุด: ${qTop.map(([k, v]) => `${esc(k)} ${v}`).join(', ')} · เหตุเหล่านี้ทำให้ MTTR ต่ำและ A สูงกว่าความจริง` : 'ทุกเหตุกรอกเวลาเริ่มและเวลาไฟกลับครบ'}</div></div>
    </div>
    <div class="rep-foot">นิยาม: MTBF = ค่าเฉลี่ยช่วงห่างระหว่างเหตุของสายเดียวกัน · MTTR = ค่าเฉลี่ยเวลาดับ · A = MTBF ÷ (MTBF + MTTR) × 100 · มิติ: ไม่ทราบสาเหตุ/ชิ้นส่วนไม่ระบุ → A, ดับ > ${SETTINGS.ramHrs} ชม. → M, นอกนั้น → R · ✓/✗ = ผ่าน/ไม่ผ่านเกณฑ์ A ≥ ${thr}% · จัดทำโดยระบบ RAMSight</div>
  </div>`;
}
function doPrint(which){
  closeModal();
  document.body.classList.toggle('print-report', which === 'report');
  if(which === 'report') renderReport();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('print-on', p.id === (which === 'report' ? 'page-report' : 'page-' + S.page)));
  $('printMeta').textContent = `${$('crumb').textContent} · ${S.grp === 'F' ? 'สายป้อน' : 'สายส่ง'} · สถานี: ${S.stn === 'ALL' ? 'ทุกสถานี' : stnName(S.stn)} · ชีต: ${S.sheet === 'ALL' ? 'ทุกชีต' : S.sheet} · พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}`;
  audit('Export PDF', which === 'report' ? 'รายงานสรุป 1 หน้า' : S.page);
  setTimeout(() => window.print(), 80);
}
$('exportPdfBtn').onclick = () => {
  if(!MODEL || !MODEL.events.length){ alert('ยังไม่มีข้อมูล'); return; }
  openModal('Export PDF', `<div class="sub">ในหน้าต่างพิมพ์ เลือก "บันทึกเป็น PDF" (Save as PDF)</div>
    <button class="care" data-print="report" style="cursor:pointer"><span class="no">${ic('file')}</span><span><b>รายงานสรุป 1 หน้า (A4)</b><span style="display:block;font-size:13.5px;color:var(--soft)">ตัวชี้วัดหลักของสายป้อนและสายส่ง · สายที่ควรดูแลก่อน · Pareto สาเหตุ · ชิ้นส่วน · คุณภาพการกรอกข้อมูล (ตามสถานีและชีตที่เลือก)</span></span></button>
    <button class="care" data-print="page" style="cursor:pointer"><span class="no">${ic('list')}</span><span><b>พิมพ์หน้าที่เปิดอยู่</b><span style="display:block;font-size:13.5px;color:var(--soft)">${esc(TITLES[S.page])} ตามที่เห็นบนจอ</span></span></button>`);
};
document.addEventListener('click', e => { const b = e.target.closest('[data-print]'); if(b) doPrint(b.dataset.print); });

/* =====================================================================
   CHROME + ROUTING
   ===================================================================== */
const TITLES = { home:'หน้าหลัก', plan:'วางแผนเป้าหมาย R/A/M', rank:'จัดอันดับ & แนวโน้ม', py:'ตรวจสอบด้วย Python' };
function paintChrome(){
  document.querySelectorAll('.admin-only').forEach(x => x.hidden = !S.admin);
  $('loginBtn').hidden = !!S.admin;
  $('adminName').textContent = S.admin ? 'แอดมิน: ' + S.admin : '';
  $('dirtyDot').hidden = !S.dirty; $('saveBtn').disabled = !S.dirty;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.page === S.page));
  $('crumb').textContent = 'RAMSight  /  ' + TITLES[S.page];
  const has = MODEL && MODEL.events.length;
  $('exportExcelBtn').disabled = $('exportPdfBtn').disabled = !has;
  // stations
  const evs = MODEL ? MODEL.events : [];
  const codes = stationCodes();
  const cnt = c => { const f = new Set(), l = new Set(); evs.forEach(e => { if(c === 'ALL' || e.stn === c) (e.grp === 'F' ? f : l).add(e.stn + e.unit); }); return `${f.size} สายป้อน · ${l.size} สายส่ง`; };
  if(S.stn !== 'ALL' && !codes.includes(S.stn)) S.stn = 'ALL';
  $('stationList').innerHTML = `<button class="stn ${S.stn === 'ALL' ? 'on' : ''}" data-stn="ALL">${ic('grid')}<span><span class="t">${codes.length ? 'ทั้ง ' + codes.length + ' สถานี' : 'ทุกสถานี'}</span><span class="s">${cnt('ALL')}</span></span></button>` +
    codes.map(c => `<button class="stn ${S.stn === c ? 'on' : ''}" data-stn="${esc(c)}">${ic('zap')}<span><span class="t">${esc(stnName(c))} (${esc(c)})</span><span class="s">${cnt(c)}</span></span></button>`).join('');
  const pill = $('dataPill');
  if(has){ const nF = scoped({ grp:'F', sheet:'ALL' }).length, nL = scoped({ grp:'L', sheet:'ALL' }).length; pill.className = 'pill ok'; pill.innerHTML = `<i></i><span>โหลดข้อมูลแล้ว ${nF} รายการ<br>จาก ${MODEL.sheets.length} ชีต<span style="display:block;font-size:12.5px;opacity:.8">สายส่ง ${nL} เหตุ</span></span>`; }
  else { pill.className = 'pill'; pill.innerHTML = '<i></i><span>ยังไม่มีข้อมูล</span>'; }
}
function renderPage(){
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== 'page-' + S.page; if(p.hidden) p.innerHTML = ''; });
  if(S.page !== 'rank') destroyChart('trend'); if(S.page !== 'py') destroyChart('lowA');
  ({ home: renderHome, plan: renderPlan, rank: renderRank, py: renderPy })[S.page]();
  paintChrome();
}
function rebuild(){ MODEL = buildModel(DATA.rows || []); renderPage(); }
document.addEventListener('click', e => {
  const n = e.target.closest('.nav[data-page]');
  if(n){ S.page = n.dataset.page; document.body.classList.remove('nav-open'); renderPage(); window.scrollTo(0, 0); try{ history.replaceState(null, '', '#' + S.page); }catch(_){} return; }
  const s = e.target.closest('[data-stn]');
  if(s){ S.stn = s.dataset.stn; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; document.body.classList.remove('nav-open'); renderPage(); return; }
  const g = e.target.closest('[data-grp]');
  if(g){ S.grp = g.dataset.grp; S.home.open.clear(); S.home.unit = ''; S.home.comp = ''; S.plan.unit = ''; S.plan.comp = ''; S.plan.sMtbf = S.plan.sMttr = null; renderPage(); return; }
  const a = e.target.closest('[data-act]');
  if(a){ if(a.dataset.act === 'upload') $('uploadBtn').click(); else openLogin(); }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-sheetsel]')){ S.sheet = e.target.value; S.home.open.clear(); S.plan.sMtbf = S.plan.sMttr = null; renderPage(); }
});
$('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('scrim').onclick = () => document.body.classList.remove('nav-open');
window.addEventListener('afterprint', () => document.querySelectorAll('.page').forEach(p => p.classList.remove('print-on')));

/* ---------------- boot ---------------- */
(function boot(){
  const who = sess.get(); if(who && admins().some(a => a.name === who)) S.admin = who;
  const h = (location.hash || '').slice(1); if(TITLES[h]) S.page = h;
  rebuild();
})();

</script>
</body>
</html>
